name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kwq:kwq@localhost:5432/kwq_dev # only needed so prisma generate can load its config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm test
        working-directory: server
