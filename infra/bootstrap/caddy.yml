---
# Configure Caddy as the reverse proxy for kwq. Idempotent.
#   ansible-playbook caddy.yml
- name: Configure Caddy
  hosts: kwq
  become: true
  vars_files:
    - vars.yml

  tasks:
    - name: Configure Caddy
      ansible.builtin.copy:
        dest: /etc/caddy/Caddyfile
        content: |
          {% if kwq_acme_email is defined %}
          {
              email {{ kwq_acme_email }}
          }

          {% endif %}
          {{ kwq_domain }} {
              encode zstd gzip
              log

              header {
                  Strict-Transport-Security "max-age=31536000"
                  X-Content-Type-Options nosniff
                  Referrer-Policy strict-origin-when-cross-origin
                  -Server
              }

              @assets path /assets/*
              header @assets >Cache-Control "public, max-age=31536000, immutable"

              # Watcher sends ~110KB max (10k body + 100k bodyHtml chars); matches Nest bodyLimit
              @hooks path /hooks/*
              request_body @hooks {
                  max_size 1MB
              }

              reverse_proxy 127.0.0.1:3000
          }
        owner: root
        group: caddy
        mode: "0640"
        validate: caddy validate --adapter caddyfile --config %s
      notify: Reload caddy
      tags: caddy

    - name: Enable Caddy
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        state: started
      tags: caddy

  handlers:
    - name: Reload caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded
