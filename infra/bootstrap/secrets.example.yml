---
# cp secrets.example.yml secrets.yml, fill in, then: ansible-vault encrypt secrets.yml
#   openssl rand -hex 32   (JWT secret)
kwq_jwt_secret: CHANGE_ME
# Observe (observe.nestjs.com) credentials
kwq_observe_app_key: CHANGE_ME
kwq_observe_app_secret: CHANGE_ME
# Web Push signing keys. Generate the pair ONCE and keep it: rotating it
# invalidates every device's push subscription.
#   npx web-push generate-vapid-keys
kwq_vapid_public_key: CHANGE_ME
kwq_vapid_private_key: CHANGE_ME
