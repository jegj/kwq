---
# Bootstrap: harden the kwq box (Ubuntu 26.04 LTS) and install requirements only. Idempotent.
# Configuration lives in postgres.yml, app.yml and caddy.yml.
# Prerequisites and run order: see README.md
#   ansible-playbook provision.yml
# Tags: base, ssh, firewall, fail2ban, upgrades, app (packages only)
- name: Provision and harden kwq box
  hosts: kwq
  become: true
  vars_files:
    - vars.yml

  pre_tasks:
    - name: Assert target is Ubuntu
      ansible.builtin.assert:
        that: ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: This playbook only supports Ubuntu
      tags: always

    # Never turn off password auth unless a key is already in place
    - name: Check admin user has an authorized key
      ansible.builtin.stat:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
      register: kwq_authorized_keys
      tags: ssh

    - name: Assert admin user can log in with a key
      ansible.builtin.assert:
        that:
          - kwq_authorized_keys.stat.exists
          - kwq_authorized_keys.stat.size > 0
        fail_msg: "{{ ansible_user }} has no authorized_keys; refusing to disable password login"
      tags: ssh

  tasks:
    # ---------------------------------------------------------------- base
    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - acl
          - apparmor
          - apparmor-utils
          - ca-certificates
          - chrony
          - fail2ban
          - gnupg
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120
      tags: base

    - name: Set timezone to UTC
      community.general.timezone:
        name: UTC
      tags: base

    - name: Enable chrony time sync
      ansible.builtin.systemd_service:
        name: chrony
        enabled: true
        state: started
      tags: base

    - name: Enable AppArmor
      ansible.builtin.systemd_service:
        name: apparmor
        enabled: true
        state: started
      tags: base

    - name: Check AppArmor is active in the kernel
      ansible.builtin.command: aa-enabled
      register: kwq_aa_enabled
      changed_when: false
      failed_when: kwq_aa_enabled.stdout.strip() != 'Yes'
      tags: base

    # File content drives "changed"; the sysctl module also flags runtime drift on every run
    - name: Apply sysctl network and kernel hardening
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-kwq-hardening.conf
        content: |
          {% for key, value in kwq_sysctl.items() %}
          {{ key }} = {{ value }}
          {% endfor %}
        owner: root
        group: root
        mode: "0644"
      notify: Reload sysctl
      tags: base

    - name: Make journald config dir
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: base

    - name: Cap journald disk usage
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/50-kwq.conf
        content: |
          [Journal]
          Storage=persistent
          SystemMaxUse={{ kwq_journal_max_use }}
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald
      tags: base

    - name: Gather service facts
      ansible.builtin.service_facts:
      tags: base

    - name: Disable unused services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ kwq_unused_services }}"
      when: item in ansible_facts['services']
      tags: base

    - name: Check swap file
      ansible.builtin.stat:
        path: /swapfile
      register: kwq_swapfile
      tags: base

    - name: Create swap file
      ansible.builtin.command: "fallocate -l {{ kwq_swap_size }} /swapfile"
      when: not kwq_swapfile.stat.exists
      changed_when: true
      tags: base

    - name: Restrict swap file permissions
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      tags: base

    - name: Format swap file
      ansible.builtin.command: mkswap /swapfile
      when: not kwq_swapfile.stat.exists
      changed_when: true
      tags: base

    - name: Persist swap file in fstab
      ansible.posix.mount:
        src: /swapfile
        path: none
        fstype: swap
        opts: sw
        state: present
      tags: base

    - name: Enable swap
      ansible.builtin.command: swapon -a
      when: ansible_facts['swaptotal_mb'] == 0
      changed_when: true
      tags: base

    # ----------------------------------------------------------------- ssh
    # 00- prefix: sshd uses the first value it sees, so this beats cloud-init's 50-cloud-init.conf
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-kwq-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          AllowUsers {{ ansible_user }}
          MaxAuthTries 3
          LoginGraceTime 30
          MaxSessions 4
          X11Forwarding no
          AllowAgentForwarding no
          ClientAliveInterval 300
          ClientAliveCountMax 2
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd
      tags: ssh

    # Proves the drop-in is actually included before sshd gets reloaded
    - name: Read effective sshd config
      ansible.builtin.command: /usr/sbin/sshd -T
      register: kwq_sshd_effective
      changed_when: false
      check_mode: false
      tags: ssh

    - name: Assert effective sshd config is hardened
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in kwq_sshd_effective.stdout"
          - "'passwordauthentication no' in kwq_sshd_effective.stdout"
          - "('allowusers ' ~ ansible_user) in kwq_sshd_effective.stdout"
      when: not ansible_check_mode
      tags: ssh

    # ------------------------------------------------------------ firewall
    - name: Enable IPv6 in ufw
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: IPV6=yes
      notify: Reload ufw
      tags: firewall

    - name: Default deny incoming
      community.general.ufw:
        direction: incoming
        default: deny
      tags: firewall

    - name: Default allow outgoing
      community.general.ufw:
        direction: outgoing
        default: allow
      tags: firewall

    - name: Rate-limit SSH
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp
      tags: firewall

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp
      tags: firewall

    # proto any = tcp + udp, UDP 443 is HTTP/3 (Caddy)
    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
      tags: firewall

    # Last, so a half-applied ruleset never locks us out
    - name: Enable ufw
      community.general.ufw:
        state: enabled
      tags: firewall

    # ----------------------------------------------------------- fail2ban
    - name: Configure fail2ban sshd jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/kwq-sshd.local
        content: |
          [sshd]
          enabled = true
          backend = systemd
          maxretry = 5
          findtime = 10m
          bantime = 1h
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban
      tags: fail2ban

    - name: Enable fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        enabled: true
        state: started
      tags: fail2ban

    # ------------------------------------------------- unattended upgrades
    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"
      tags: upgrades

    - name: Configure automatic reboot after updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52kwq-unattended-upgrades
        content: |
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "{{ kwq_reboot_time }}";
        owner: root
        group: root
        mode: "0644"
      tags: upgrades

    # ------------------------------------------------------------ app stack
    - name: Add NodeSource apt repo
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: "https://deb.nodesource.com/node_{{ kwq_node_major }}.x"
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        state: present
      tags: app

    - name: Add PostgreSQL (PGDG) apt repo
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        state: present
      tags: app

    - name: Add Caddy apt repo
      ansible.builtin.deb822_repository:
        name: caddy
        types: deb
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/ubuntu
        suites: any-version
        components: main
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        state: present
      tags: app

    - name: Install app stack packages
      ansible.builtin.apt:
        name:
          - caddy
          - nodejs
          - "postgresql-{{ kwq_postgres_version }}"
          - python3-psycopg2
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120
      tags: app

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

    - name: Reload ufw
      community.general.ufw:
        state: reloaded

    - name: Restart fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted

    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
